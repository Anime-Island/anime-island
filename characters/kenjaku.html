<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kenjaku | Anime Island</title>
<link rel="icon" type="image/png" href="../images/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800&family=Barlow:wght@500;600&family=Dela+Gothic+One&display=swap">
<link rel="stylesheet" href="../assets/character.css">
</head>
<body>
<div id="app" class="wrap"></div>

<script>
/* HOST PAGE DATA: the only part to edit for the host.
   Same layout as the contestant pages, but this is the host, not a contestant.
   Block types and options are explained at the top of monkey-d-luffy.html (this page also supports
   { type: "links", items: [{ label, href }] } for buttons).
   Images: ../images/kenjaku.png (render) and ../images/kenjaku-logo.png (optional name logo).
   This is a public page: only add information viewers should know before watching. */
window.CHARACTER = {
  slug: "kenjaku",
  name: "Kenjaku",
  status: "Host of Anime Island",
  colors: ["#4a4636", "#0b0b0f"],
  accent: "#ffb347",

  facts: [
    { label: "Original Series", value: "Jujutsu Kaisen" },
    { label: "Role", value: "Host" }
  ],

  sections: [
    {
      id: "host",
      title: "The Host",
      blocks: [
        {
          type: "text",
          wide: true,
          body: [
            "Kenjaku is the host of Anime Island, the reality competition show featuring 12 contestants from different anime universes.",
            "He is not one of the contestants."
          ]
        }
      ]
    },

    {
      id: "show",
      title: "On Anime Island",
      blocks: [
        {
          type: "text",
          heading: "Role",
          wide: true,
          body: "Kenjaku hosts Anime Island and is not competing."
        },
        {
          type: "links",
          items: [
            { label: "Read the story", href: "../story.html" },
            { label: "Meet the contestants", href: "../index.html" }
          ]
        },
        { type: "note", text: "More information about Kenjaku will be added here." }
      ]
    }
  ]
};
</script>
<script src="../assets/character.js"></script>
</body>
</html>
