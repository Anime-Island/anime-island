<div id="app" class="wrap"></div>

     render      images/<slug>.png          (same file the roster uses)
     name logo   images/<slug>-logo.png     (optional, replaces the big text name)

   Section blocks you can use inside any section:
     { type: "text",      heading, body }                 body = text, or a list of paragraphs
     { type: "list",      heading, items: [..] }          bullet list
     { type: "terms",     heading, items: [{term, text}] }

     { type: "relations", items: [{name, tag, tone, text}] }   tone: "friendly" | "conflict" | omit
     { type: "moves",     items: [{slot, name, variants, variantLabel}] }

   ===================================================================== */

          type: "list",
          heading: "Important Details to Preserve",

            "How much he values freedom.",
            "His loyalty to his friends.",
            "His love of food and adventure.",
