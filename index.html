<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Anime Island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800&family=Barlow:wght@500;600&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: wide horizontal page. Slim brand bar, one title row, then a 6 x 2 roster of
   corner-cut square slots (4 / 3 / 2 columns as the screen narrows). The slots carry all the color. */
:root {
  --ink: #090b15;
  --ink-2: #11152a;
  --line: #262c4d;
  --text: #f4f6ff;
  --muted: #8f97bd;
  --sun: #ffb347;
  --sea: #2fd0c0;
  --font-display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --font-name: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gap: 14px;
  --cut: 16px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  position: relative;
  overflow-x: hidden;
}

/* Sunset glow top-left, sea glow bottom-right, fine dot texture over both. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 8% -12%, rgba(255, 140, 60, 0.20), transparent 46%),
    radial-gradient(circle at 98% 112%, rgba(47, 208, 192, 0.16), transparent 46%),
    radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1.3px) 0 0 / 18px 18px;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1570px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* ---------- Brand bar ---------- */
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.brand {
  margin: 0;
  min-width: 0;
  line-height: 0;
}

.logo {
  display: block;
  height: clamp(44px, 5vw, 64px);
  width: auto;
  max-width: 100%;
}

.season-tag {
  font-family: var(--font-name);
  font-style: italic;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #1a1204;
  background: var(--sun);
  padding: 5px 18px 5px 14px;
  clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
}

/* ---------- Title row ---------- */
.heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.heading h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(26px, 3.2vw, 44px);
  line-height: 1;
  text-wrap: balance;
}

.heading p {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  font-weight: 500;
}

.heading p b {
  color: var(--text);
  font-family: var(--font-name);
  font-style: italic;
  font-weight: 800;
  font-size: 22px;
  margin-right: 4px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Roster grid ---------- */
.roster {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 250px));
  justify-content: center;
  gap: var(--gap);
}

@media (max-width: 1099px) { .roster { grid-template-columns: repeat(4, minmax(0, 250px)); } }
@media (max-width: 779px)  { .roster { grid-template-columns: repeat(3, minmax(0, 250px)); } }
@media (max-width: 519px)  { .roster { grid-template-columns: repeat(2, minmax(0, 250px)); --gap: 10px; --cut: 12px; } }

/* ---------- Slot ---------- */
.slot {
  --c1: #555;
  --c2: #222;
  --accent: #fff;
  --s: 1.06;
  --x: 0%;
  --y: 0%;
  position: relative;
  aspect-ratio: 250 / 333;
  max-width: 100%;
  container-type: inline-size;
  cursor: pointer;
  outline: none;
  filter:
    drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55))
    drop-shadow(0 0 0 transparent);
  transition: transform 0.18s ease, filter 0.18s ease;
}

.frame {
  position: absolute;
  inset: 0;
  padding: 2px;
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.55), var(--c1) 35%, var(--c2));
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: background 0.18s ease;
}

.face {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(160deg, var(--c1), var(--c2));
  clip-path: polygon(0 0, calc(100% - var(--cut) + 2px) 0, 100% calc(var(--cut) - 2px), 100% 100%, 0 100%);
}

/* Speed-line rays fanning out from behind the character. */
.face::before {
  content: "";
  position: absolute;
  inset: -20%;
  background: repeating-conic-gradient(from 8deg at 50% 78%, rgba(255, 255, 255, 0.10) 0deg 7deg, transparent 7deg 16deg);
  -webkit-mask-image: radial-gradient(circle at 50% 78%, #000 0%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 78%, #000 0%, transparent 72%);
  pointer-events: none;
}

/* A slanted accent band behind the render. */
.face::after {
  content: "";
  position: absolute;
  left: -10%;
  right: -10%;
  top: 38%;
  height: 24%;
  background: var(--accent);
  opacity: 0.20;
  transform: skewY(-14deg);
  pointer-events: none;
}

.num {
  position: absolute;
  top: 7px;
  left: 8px;
  z-index: 3;
  font-family: var(--font-name);
  font-style: italic;
  font-weight: 800;
  font-size: clamp(12px, 6cqi, 15px);
  letter-spacing: 0.06em;
  line-height: 1;
  color: #fff;
  background: rgba(0, 0, 0, 0.45);
  padding: 3px 7px 3px 6px;
  font-variant-numeric: tabular-nums;
}

/* Render area: transparent PNG sits straight on the color. */
.render {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.render img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: contain;
  object-position: 50% 100%;
  transform-origin: 50% 100%;
  transform: translate(var(--x), var(--y)) scale(var(--s));
  filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45));
  transition: transform 0.22s ease;
}

/* Placeholder shown until a render exists. */
.ghost {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding-bottom: 14%;
}

.ghost svg {
  width: 62%;
  height: auto;
  color: #fff;
  opacity: 0.16;
}

.ghost span {
  position: absolute;
  top: 46%;
  font-family: var(--font-name);
  font-weight: 600;
  font-size: clamp(10px, 5.4cqi, 13px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  opacity: 0.55;
}

.slot.no-render .ghost { display: flex; }
.slot.no-render .render img { display: none; }

/* Name plate: slanted band across the bottom. */
.plate {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 3;
  min-height: 21%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 5% 6% 3.5% 7%;
}

.plate::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, rgba(5, 6, 14, 0.92), rgba(5, 6, 14, 0.62));
  border-top: 3px solid var(--accent);
  transform: skewY(-4deg);
  transform-origin: 0 100%;
  transition: border-color 0.18s ease;
}

.name {
  display: block;
  font-family: var(--font-name);
  font-style: italic;
  font-weight: 800;
  font-size: 9.6cqi;
  line-height: 1;
  letter-spacing: 0.015em;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Optional name logo (images/<slug>-logo.png). Replaces the text when the file exists,
   tilted to follow the slant of the plate. */
.logo-name {
  display: none;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 13.5cqi;
  object-fit: contain;
  object-position: 0 50%;
  transform: skewY(-4deg);
  transform-origin: 0 100%;
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.5));
}

.slot.has-logo .logo-name { display: block; }
.slot.has-logo .name,
.slot.has-logo .alias { display: none; }

.alias {
  display: block;
  margin-top: 2px;
  font-family: var(--font-name);
  font-weight: 600;
  font-size: 6.6cqi;
  line-height: 1;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
}

/* Invisible link layer for cards that have a character page. */
.slot-link {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: block;
}

/* ---------- Hover / focus ---------- */
.slot:hover,
.slot:focus-visible {
  transform: translateY(-7px);
  z-index: 5;
  filter:
    drop-shadow(0 14px 16px rgba(0, 0, 0, 0.6))
    drop-shadow(0 0 16px color-mix(in srgb, var(--c1) 75%, transparent));
}

.slot:hover .frame,
.slot:focus-visible .frame {
  background: linear-gradient(150deg, #fff, var(--accent) 55%, var(--c1));
}

.slot:hover .render img,
.slot:focus-visible .render img {
  transform: translate(var(--x), var(--y)) scale(calc(var(--s) * 1.06));
}

.slot:focus-visible .frame {
  background: #fff;
}

.slot:active { transform: translateY(-3px); }

/* ---------- Footer ---------- */
.foot {
  display: flex;
  justify-content: space-between;
  gap: 8px 20px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

@media (prefers-reduced-motion: reduce) {
  .slot, .frame, .render img, .plate::before { transition: none; }
  .slot:hover, .slot:focus-visible, .slot:active { transform: none; }
}
</style>

<div class="wrap">
  <header class="bar">
    <h1 class="brand">
      <!-- Logo file: images/logo.png (replace the file to change it) -->
      <img class="logo" src="images/logo.png" alt="Anime Island">
    </h1>
    <span class="season-tag">Season 1</span>
  </header>

  <section aria-labelledby="roster-title">
    <div class="heading">
      <h2 id="roster-title">Season 1 roster</h2>
      <p><b>12</b> contestants</p>
    </div>
  </section>

  <ul class="roster" id="roster" aria-label="Season 1 contestants"></ul>

  <footer class="foot">
    <span>Anime Island, a Roblox anime show.</span>
    <span>Season 1 roster</span>
  </footer>
</div>

<script>
/* =====================================================================
   ROSTER CONFIG: edit this list, nothing else.

   Renders:  put each transparent PNG in the  images/  folder, named after the slug
             (images/joseph-joestar.png). To use a different file, add  image: "images/other.png".
             Until a render exists, the slot shows a placeholder silhouette.
   Colors:   colors = [light, dark] for the background gradient, accent = bar and highlights.
   Framing:  optional per-character tweaks, only if a render needs nudging.
               scale  (default 1.06)  bigger or smaller
               x, y   (default "0%")  shift sideways or up/down, e.g. y: "-4%"
   Name logo: put images/<slug>-logo.png (e.g. images/monkey-d-luffy-logo.png). It replaces the
             text name on that card automatically. Optional override: nameImage: "images/other.png".
   Page:     page: "characters/<slug>.html" makes the card open that character's page.
             Cards without a page stay as they are.
   Alias:    optional second line under the name (hidden when a name logo is used).
   ===================================================================== */
const ROSTER = [
  { slug: "joseph-joestar",   name: "Joseph Joestar",   colors: ["#2aa57f", "#0c3f3c"], accent: "#a56bff" },
  { slug: "monkey-d-luffy",   name: "Monkey D. Luffy",  colors: ["#ff3b30", "#7d0f12"], accent: "#ffd23f", page: "characters/monkey-d-luffy.html" },
  { slug: "naruto-uzumaki",   name: "Naruto Uzumaki",   colors: ["#ff9a1f", "#a03c07"], accent: "#1f7bff", page: "characters/naruto-uzumaki.html" },
  { slug: "weak-kingsley",    name: "Weak Kingsley",    colors: ["#9ccc3c", "#36540f"], accent: "#f7e04a", page: "characters/weak-kingsley.html" },
  { slug: "ryomen-sukuna",    name: "Ryomen Sukuna",    colors: ["#c2185b", "#2a0720"], accent: "#ff9bc2", page: "characters/ryomen-sukuna.html" },
  { slug: "gilgamesh",        name: "Gilgamesh",        colors: ["#d4a017", "#3b2503"], accent: "#ff4d4d", page: "characters/gilgamesh.html" },
  { slug: "saiki-kusuo",      name: "Saiki Kusuo",      colors: ["#35c4dd", "#0f4f78"], accent: "#ff8fc2", page: "characters/saiki-kusuo.html" },
  { slug: "vegeta",           name: "Vegeta",           colors: ["#3a63f0", "#0c1a66"], accent: "#e8efff", page: "characters/vegeta.html" },
  { slug: "sosuke-aizen",     name: "Sosuke Aizen",     colors: ["#8a5cf0", "#2b1670"], accent: "#d8c8ff", page: "characters/sosuke-aizen.html" },
  { slug: "killua-zoldyck",   name: "Killua Zoldyck",   colors: ["#5d86b5", "#1a2d4d"], accent: "#4de3ff", page: "characters/killua-zoldyck.html" },
  { slug: "saitama",          name: "Saitama",          colors: ["#ffe04a", "#d98b00"], accent: "#e5212b", page: "characters/saitama.html" },
  { slug: "chizome-akaguro",  name: "Chizome Akaguro",  alias: "Stain", colors: ["#4a4f63", "#0d0f18"], accent: "#e0243c", page: "characters/chizome-akaguro.html" }
];
/* ===================================================================== */

(function () {
  var list = document.getElementById("roster");

  var SILHOUETTE =
    '<svg viewBox="0 0 100 120" aria-hidden="true" fill="currentColor">' +
    '<circle cx="50" cy="34" r="21"/>' +
    '<path d="M6 120c0-26 18-44 44-44s44 18 44 44z"/></svg>';

  ROSTER.forEach(function (c, i) {
    var li = document.createElement("li");
    li.className = "slot";
    li.tabIndex = 0;
    li.setAttribute("aria-label", c.name + (c.alias ? " (" + c.alias + ")" : ""));
    li.style.setProperty("--c1", c.colors[0]);
    li.style.setProperty("--c2", c.colors[1]);
    li.style.setProperty("--accent", c.accent);
    if (c.scale != null) li.style.setProperty("--s", c.scale);
    if (c.x) li.style.setProperty("--x", c.x);
    if (c.y) li.style.setProperty("--y", c.y);

    var n = String(i + 1);

    // Optional link to the character's own page (an invisible layer over the whole card).
    if (c.page) {
      var link = document.createElement("a");
      link.className = "slot-link";
      link.href = c.page;
      link.tabIndex = -1;
      link.setAttribute("aria-label", c.name + " page");
      li._pageLink = link;
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter") window.location.href = c.page;
      });
    }
    if (n.length < 2) n = "0" + n;

    li.innerHTML =
      '<div class="frame"><div class="face">' +
        '<span class="num">' + n + '</span>' +
        '<div class="ghost">' + SILHOUETTE + '<span>Render soon</span></div>' +
        '<div class="render"></div>' +
        '<div class="plate">' +
          '<span class="name">' + c.name + '</span>' +
          (c.alias ? '<span class="alias">(' + c.alias + ')</span>' : '') +
        '</div>' +
      '</div></div>';

    if (li._pageLink) li.appendChild(li._pageLink);

    var img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.draggable = false;
    img.addEventListener("error", function () { li.classList.add("no-render"); });
    img.addEventListener("load", function () { li.classList.remove("no-render"); });
    li.querySelector(".render").appendChild(img);
    img.src = c.image || ("images/" + c.slug + ".png");

    // Name logo: shows in place of the text name if images/<slug>-logo.png exists.
    var nameLogo = new Image();
    nameLogo.className = "logo-name";
    nameLogo.alt = "";
    nameLogo.decoding = "async";
    nameLogo.draggable = false;
    nameLogo.addEventListener("load", function () { li.classList.add("has-logo"); });
    nameLogo.addEventListener("error", function () { li.classList.remove("has-logo"); });
    li.querySelector(".plate").insertBefore(nameLogo, li.querySelector(".name"));
    nameLogo.src = c.nameImage || ("images/" + c.slug + "-logo.png");

    list.appendChild(li);
  });
})();
</script>
